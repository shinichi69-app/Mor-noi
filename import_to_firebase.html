    // 3. ฟังก์ชัน Import ข้อมูล
    async function importData() {
        const btn = document.getElementById('importBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "⏳ กำลังนำเข้าข้อมูล...";
        status.innerText = "";
        status.className = "";

        try {
            const batch = db.batch();
            
            clinicalKB.forEach(disease => {
                // อ้างอิงไปที่ Collection 'conditions' และใช้ ID ของโรคเป็น Document ID
                const docRef = db.collection("conditions").doc(disease.id);
                batch.set(docRef, disease);
            });

            await batch.commit();
            
            status.innerText = `✅ สำเร็จ! นำเข้าข้อมูล ${clinicalKB.length} โรคเข้าสู่ Firebase เรียบร้อยแล้ว`;
            btn.innerText = "🎉 Import เสร็จสิ้น";
            
            // แจ้งเตือนให้กลับไปหน้าหลัก
            setTimeout(() => {
                alert("นำเข้าข้อมูลสำเร็จ! ตอนนี้คุณสามารถปิดหน้านี้ และกลับไปทดสอบระบบซักประวัติใน mornoi.html ได้เลยครับ");
            }, 500);

        } catch (error) {
            console.error(error);
            status.innerText = "❌ เกิดข้อผิดพลาด: " + error.message + " (กรุณาตรวจสอบ Rules ใน Firebase ว่าอนุญาตให้อ่าน/เขียนหรือไม่)";
            status.className = "error";
            btn.disabled = false;
            btn.innerText = "🚀 ลอง Import อีกครั้ง";
        }
    }
</script>

</body>
</html>
